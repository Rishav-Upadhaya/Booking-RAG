[project]
name = "palm-rag"
version = "0.1.0"
description = "Document RAG backend: ingestion + conversational RAG with hybrid search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "pinecone>=9.0",
    "sentence-transformers>=3.0",
    "pypdf>=4.2",
    "langchain>=1.3",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=0.3",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
